name: Daily Windows Bundle

on:
  push:
    branches:
      - "ci/**"
  pull_request:
    paths:
      - "**/pom.xml"
      - "**/src/**"
      - "tools/**"
      - ".github/workflows/daily-windows-bundle.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-windows-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-bundle:
    name: Build Windows desktop bundle on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # The Windows OpenCV .dll, adb.exe and the .traineddata OCR models are all
      # tracked with Git LFS. If any of them is still an LFS pointer stub the
      # build would silently produce an unusable bundle, so fail loudly instead.
      - name: Verify Git LFS assets are real binaries
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          missing=0
          while read -r asset; do
            [[ -z "${asset}" ]] && continue
            if head -c 45 "${asset}" | grep -q 'git-lfs.github.com/spec'; then
              echo "::error file=${asset}::LFS asset was not materialised (still a pointer stub)."
              missing=1
            fi
          done < <(git lfs ls-files --name-only)
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          echo "All Git LFS assets were materialised."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The saved-frame vision tests run OCR through tess4j, which binds the
      # host libtesseract/libleptonica at runtime. OpenCV itself needs no system
      # package: the openpnp artifact ships the Linux native image.
      - name: Install Tesseract native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr libtesseract-dev libleptonica-dev

      # Tests are intentionally NOT skipped. The vision/OCR suites are the ones
      # most likely to regress, and they run correctly on Linux now that the
      # OpenCV native image is selected per platform.
      - name: Build Windows desktop bundle
        run: mvn -B --no-transfer-progress clean install -Djavafx.platform=win

      - name: Verify Windows bundle contents
        shell: bash
        run: |
          set -euo pipefail

          zip_path="$(find fg-app/target -maxdepth 1 -type f -name '*-desktop-bundle.zip' | sort | tail -n 1)"
          if [[ -z "${zip_path}" ]]; then
            echo "::error::No desktop bundle ZIP found under fg-app/target."
            exit 1
          fi

          unzip -l "${zip_path}" > /tmp/frostguard-windows-bundle.txt

          require() {
            if ! grep -Eq "$1" /tmp/frostguard-windows-bundle.txt; then
              echo "::error::Bundle is missing an expected entry: $1"
              exit 1
            fi
          }

          # Windows JavaFX runtime must be present...
          require 'lib/javafx-base-[^/]+-win\.jar'
          require 'lib/javafx-controls-[^/]+-win\.jar'
          require 'lib/javafx-fxml-[^/]+-win\.jar'
          require 'lib/javafx-graphics-[^/]+-win\.jar'

          # ...and the Linux runtime must not leak into a Windows bundle.
          if grep -Eq 'lib/javafx-[^/]+-linux\.jar' /tmp/frostguard-windows-bundle.txt; then
            echo "::error::Bundle contains Linux JavaFX runtime JARs."
            exit 1
          fi

          # Application and watcher entry points.
          require 'frostguard-[^/]+\.jar'
          require 'fg-watcher-[^/]+\.jar'
          require 'fg-watcher\.bat'

          # Bundled native tooling and OCR models.
          require 'lib/adb/adb\.exe'
          require 'lib/adb/AdbWinApi\.dll'
          require 'lib/tesseract/eng\.traineddata'

          # Third-party runtime JARs that the launcher manifest references.
          require 'lib/opencv-[^/]+\.jar'
          require 'lib/tess4j-[^/]+\.jar'

          # Debugging UI template sprites and user-editable task scripts.
          require 'templates/'
          require 'custom_tasks/'

          # Guard against the regression where the distribution ZIP was built
          # before the runtime JARs had been staged into target/lib.
          lib_jars="$(grep -Ec 'lib/[^/]+\.jar' /tmp/frostguard-windows-bundle.txt || true)"
          echo "Runtime JARs bundled under lib/: ${lib_jars}"
          if [[ "${lib_jars}" -lt 50 ]]; then
            echo "::error::Only ${lib_jars} runtime JARs found under lib/; the bundle looks incomplete."
            exit 1
          fi

          # Every Class-Path entry in the launcher manifest must really exist.
          app_jar="$(find fg-app/target -maxdepth 1 -type f -name 'frostguard-*.jar' \
            ! -name 'original-*' | sort | tail -n 1)"
          unzip -p "${app_jar}" META-INF/MANIFEST.MF > /tmp/frostguard-manifest.txt
          python3 ci/verify_bundle_manifest.py \
            /tmp/frostguard-manifest.txt /tmp/frostguard-windows-bundle.txt

          echo "FROSTGUARD_WINDOWS_BUNDLE=${zip_path}" >> "${GITHUB_ENV}"
          echo "FROSTGUARD_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" \
            >> "${GITHUB_ENV}"

          {
            echo "### Windows desktop bundle"
            echo
            echo "- Archive: \`$(basename "${zip_path}")\`"
            echo "- Size: $(du -h "${zip_path}" | cut -f1)"
            echo "- Runtime JARs under \`lib/\`: ${lib_jars}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Windows desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: frostguard-windows-desktop-bundle-${{ env.FROSTGUARD_VERSION }}
          path: ${{ env.FROSTGUARD_WINDOWS_BUNDLE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore
          retention-days: 7
